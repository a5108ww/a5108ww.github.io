# 照片的像素尺寸，給 _includes/photo.html 輸出 width/height 屬性用。
#
# 為什麼需要：圖片沒有尺寸屬性時，瀏覽器在載入前不知道要留多少空間，
# 載入後才把下方內容推開（CLS）。旅遊文一篇有 40~65 張照片且都是 lazy
# load，捲動時會一路跳動。有了 width/height，瀏覽器就能先按比例保留位置。
#
# 為什麼不用固定的 aspect-ratio 佔位：這些照片 82% 是直拍（1200x1600），
# 套橫向比例會讓多數照片被框在橫框裡、左右大量留白。
#
# 怎麼重新產生（例如壓縮或換圖之後，在專案根目錄執行）：
#   for f in assets/images/*/*.jpg assets/images/*/*/*.jpg; do
#     s=$(file -b "$f" | grep -oE '[0-9]{3,}x[0-9]{3,}' | tail -1)
#     echo "\"${f#assets/images/}\": { w: ${s%x*}, h: ${s#*x} }"
#   done > _data/photo_sizes.yml
#
# key 是 photo.html 的 src 參數（assets/images/ 底下的相對路徑）。
# 查不到的圖不會輸出尺寸屬性，只是少了佔位，不會壞掉。


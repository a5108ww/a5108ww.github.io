# 國中小英文單字表，由 _includes/vocab-cards.html 輸出成單字卡：
#   elementary 給〈國小必備英文單字〉，junior 給〈國中必備英文單字〉。
# elementary：國小，欄位 en（單字）、zh（中文）
# junior：國中，另加 pos（詞性：n. 名詞、v. 動詞、adj. 形容詞、adv. 副詞、
#         prep. 介系詞、conj. 連接詞、pron. 代名詞、aux. 助動詞）
# 國中只列國小沒有的字，兩邊合計約 1200 字（課綱國中階段的要求）。
# 依主題分組，這裡的順序就是文章裡的顯示順序，新增主題不必改模板。
# yes、no、on、true 這類字要加引號，否則 YAML 會把它們讀成布林值。

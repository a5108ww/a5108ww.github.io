<header class="site-header">
  <div class="site-header__bar">
    <div class="site-title">
      <a href="{{ '/' | relative_url }}">{{ site.title | default: "我的部落格" }}</a>
    </div>

    <!-- 漢堡按鈕：僅手機版顯示，展開／收合由 assets/js/site.js 控制 -->
    <button class="nav-toggle" type="button"
            aria-controls="site-nav" aria-expanded="false" aria-label="開啟選單">
      <span class="nav-toggle__bar"></span>
      <span class="nav-toggle__bar"></span>
      <span class="nav-toggle__bar"></span>
    </button>
  </div>

  <nav class="site-nav" id="site-nav">
    <ul>
      {% for item in site.data.navigation %}
        <li>
          <a href="{% if item.external %}{{ item.link }}{% else %}{{ item.link | relative_url }}{% endif %}"
             {% if item.external %}target="_blank" rel="noopener"{% endif %}>
            {{ item.name }}
          </a>
        </li>
      {% endfor %}
    </ul>
  </nav>
</header>

<header class="site-header">
  <div class="site-title">
    <a href="{{ '/' | relative_url }}">{{ site.title | default: "我的部落格" }}</a>
  </div>

  <nav class="site-nav">
    <ul>
      {% for item in site.data.navigation %}
        <li>
          <a href="{% if item.external %}{{ item.link }}{% else %}{{ item.link | relative_url }}{% endif %}"
             {% if item.external %}target="_blank"{% endif %}>
            {{ item.name }}
          </a>
        </li>
      {% endfor %}
    </ul>
  </nav>
</header>
